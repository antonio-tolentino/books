name: MCP server
version: 0.0.1
schema: v1
mcpServers:
  - name: GitHub mcp server
    command: docker
    args:
      - "run"
      - "-i"
      - "--rm"
      - "-e"
      - "GITHUB_PERSONAL_ACCESS_TOKEN"
      - "ghcr.io/github/github-mcp-server"
    env: {
     GITHUB_PERSONAL_ACCESS_TOKEN: "${{ secrets.GITHUB_PERSONAL_ACCESS_TOKEN }}"
    }
